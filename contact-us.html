<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contact Us | Zamfara Online Shopping Store</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f4f4;
      margin: 0;
      padding: 0;
    }

    header {
      background-color: #009688;
      color: white;
      text-align: center;
      padding: 20px 0;
    }

    .container {
      max-width: 700px;
      margin: 30px auto;
      background-color: #fff;
      padding: 30px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    h1 {
      color: #333;
      text-align: center;
    }

    p {
      font-family: cursive;
      text-align: center;
      color: #555;
      margin-bottom: 30px;
    }

    form {
      display: flex;
      flex-direction: column;
    }

    label {
      margin-bottom: 5px;
      font-weight: bold;
    }

    input, textarea {
      padding: 10px;
      margin-bottom: 20px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 16px;
      width: 100%;
    }

    button {
      background-color: #009688;
      color: white;
      border: none;
      padding: 12px;
      font-size: 16px;
      cursor: pointer;
      border-radius: 4px;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #00796b;
    }

    footer {
      background-color: #333;
      color: #fff;
      text-align: center;
      padding: 15px 0;
      margin-top: 40px;
      text-decoration:
    }
  </style>
</head>
<body>

  <header>
    <h1>Zamfara Online Shopping Store</h1>
  </header>

  <div class="container">
    <h1>Contact Us</h1>
    <p>Have a question or feedback? We'd love to hear from you.</p>

    <form action="#" method="post">
      <label for="name">Your Name:</label>
      <input type="text" id="name" name="name" placeholder="Enter your full name" required />

      <label for="email">Your Email:</label>
      <input type="email" id="email" name="email" placeholder="Enter your email address" required />

      <label for="message">Your Message:</label>
      <textarea id="message" name="message" rows="5" placeholder="Type your message here..." required></textarea>

      <button type="submit">Send Message</button>
    </form>
  </div>

  <footer>
    &copy; 2025 Zamfara Online Shopping Store. All rights reserved.
  </footer>

</body>
</html>
